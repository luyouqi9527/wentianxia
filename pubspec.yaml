name: wentianxia
description: "闻天下 —— 基于 Flutter + Material 3 的新闻阅读 App：聚合数据新闻头条 API、垂直滑动浏览、毛玻璃交互、本地收藏。"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1
  # 网络请求
  dio: ^5.7.0
  # 本地存储：API Key、首次启动标记、收藏
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # 路由
  go_router: ^14.6.2
  # 模型生成
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  # 浏览器跳转
  url_launcher: ^6.3.0
  # 图片加载
  cached_network_image: ^3.4.1
  # 本地路径（Hive 数据库目录）
  path_provider: ^2.1.4
  # 时间格式化
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  # 2.5.7 与 hive_generator 2.0.1 的 source_gen 约束兼容（2.5.8+ 会冲突）
  freezed: 2.5.7
  json_serializable: ^6.9.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
