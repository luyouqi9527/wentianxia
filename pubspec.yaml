name: wentianxia
description: "闻天下 —— 基于 Flutter + Material 3 的新闻阅读 App：聚合数据新闻头条 API、垂直滑动浏览、液态玻璃（真·背景折射）、本地收藏。"
publish_to: "none"

version: 3.0.0+5

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1
  # 网络请求
  dio: ^5.7.0
  # 本地存储：API Key / 首启标记 / 收藏 / 材质偏好。
  # 3.0.0 起从 hive 2.2.3 换到官方维护分支 hive_ce（API 兼容）：
  # hive_generator 2.0.1 只能配 analyzer ^6/7，而 Dart 3.13 需要 analyzer ^14。
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  # 路由
  go_router: ^14.6.2
  # 模型生成
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  # 浏览器跳转
  url_launcher: ^6.3.0
  # 图片加载
  cached_network_image: ^3.4.1
  # 本地路径（Hive 数据库目录）
  path_provider: ^2.1.4
  # 时间格式化
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # 代码生成（3.0.0 起整体升到支持 Dart 3.13 的版本）
  build_runner: ^2.16.1
  build: ^4.0.0
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  hive_ce_generator: ^1.11.3

flutter:
  uses-material-design: true

  # 液态玻璃的「真·背景折射」着色器。
  # 引擎会把背景纹理绑到第 0 个 sampler2D，并用第 0 个 vec2 uniform 传纹理尺寸；
  # 详见 shaders/liquid_glass.frag 顶部注释与 lib/core/widgets/liquid_glass.dart。
  shaders:
    - shaders/liquid_glass.frag
