plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// ---------------------------------------------------------------------------
// 固定签名（2.0.0 修复「应用签名不同，需要删除旧版本」）
//
// 1.x 用的是 AGP 默认 debug 签名：密钥随机器/构建环境变化，而 CodeMagic 与本机
// 又是两个环境，于是覆盖安装时荣耀等系统的安装器会报「签名不一致，需先卸载」
// （卸载 = 清空数据）。
//
// 解决方式：把密钥库提交进仓库（个人项目），让 **debug 与 release 共用同一把
// 密钥**，本地与 CI 产出的 APK 签名完全一致，覆盖安装不再报错。
//
// 想要更安全的方案：把 jks 移出仓库，改从 key.properties / 环境变量读取，
// 并在 CodeMagic 里配置对应环境变量。
// ---------------------------------------------------------------------------
def wentianxiaKeystore = file('wentianxia-release.jks')
def hasWentianxiaKeystore = wentianxiaKeystore.exists()

android {
    namespace = "com.wentianxia.news"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // AGP 8.x works best with Java 17 (CodeMagic uses java: 17).
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.wentianxia.news"
        // url_launcher / hive_flutter need minSdk >= 21; 23 is safer.
        minSdk = 23
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    signingConfigs {
        if (hasWentianxiaKeystore) {
            wentianxia {
                storeFile = wentianxiaKeystore
                storePassword = "wentianxia2026"
                keyAlias = "wentianxia"
                keyPassword = "wentianxia2026"
            }
        }
    }

    buildTypes {
        release {
            // 与 debug 共用同一把密钥 → 本地 / CI 签名一致，覆盖安装不报错
            signingConfig = hasWentianxiaKeystore
                    ? signingConfigs.wentianxia
                    : signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
        debug {
            if (hasWentianxiaKeystore) {
                signingConfig = signingConfigs.wentianxia
            }
        }
    }

    packagingOptions {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }
}

flutter {
    source = "../.."
}
