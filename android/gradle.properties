org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true

# AGP 会检查工程路径是否含非 ASCII 字符（本机路径为 D:\文件\代码\...）。
# 这是 Windows 上的历史限制：AGP 的 aapt2/PNG 处理在某些非 UTF-8 代码页下会出错。
# 本项目在该路径下已实际构建/测试通过（Java 源文件为 UTF-8，资源目录名全为 ASCII），
# 因此显式关闭该检查。若你把工程移到纯 ASCII 路径（例如 D:\dev\wentianxia），
# 可以删掉这一行。
android.overridePathCheck=true
