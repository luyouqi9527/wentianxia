// 3.0.0：与 Flutter 3.47.5 官方模板保持一致（Gradle 9.3.1 需要 Java 17+，本机用 21）。
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true

# AGP 9 只读取新 DSL；Flutter 3.47.5 模板通过这两个开关显式 opt out，
# 否则 flutter-gradle-plugin 应用时会报 "only the new DSL interface will be read"。
android.newDsl=false
android.builtInKotlin=false

# AGP 会检查工程路径是否含非 ASCII 字符（本机路径为 D:\文件\代码\...）。
# 注意：这一行只能消掉 AGP 的**警告**；Dart AOT(app.dill) 与 impellerc
# (ink_sparkle.frag) 在中文路径下仍会真实失败，请把工程放到纯 ASCII 路径构建
# （详见 README「快速开始」）。
android.overridePathCheck=true
